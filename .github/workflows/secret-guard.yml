# ==============================================================================
# PROJECT SHIELD: Enterprise DevSecOps CI/CD Pipeline
# File: .github/workflows/secret-guard.yml
# Description: Multi-Ring security validation & automated deployment to AWS EKS
# ==============================================================================

name: Project Shield DevSecOps Pipeline  # Display name in the GitHub Actions UI tab

# Defines workflow triggers: When should this pipeline execute?
on:
  push:
    branches:
      - main                            # Triggers on push to main branch
      - 'feature/*'                     # Triggers on push to any feature branch
  pull_request:
    branches:
      - main                            # Triggers when opening a PR against main

jobs:
  # ============================================================================
  # RING 1: Secret Leak Protection (Gitleaks)
  # Deep-scans Git history to catch hardcoded AWS keys, API tokens, or passwords
  # ============================================================================
  ring1-secret-scan:
    name: "Ring 1: Secret Guard Scan (Gitleaks)"
    runs-on: ubuntu-latest              # Provision a clean Linux runner on GitHub

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0                # Fetch full commit history so Gitleaks can inspect past commits

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Built-in token to interact with repo API

  # ============================================================================
  # RING 2: Container Security Audit (Aqua Trivy)
  # Scans Docker container image layers for HIGH and CRITICAL vulnerabilities (CVEs)
  # ============================================================================
  ring2-trivy-scan:
    name: "Ring 2: Vulnerability Audit (Trivy)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Local Image for Scanning
        run: |
          # Build a temporary local image using your docker-shield Dockerfile
          docker build -t shield-app:local -f docker-shield .

      - name: Run Aqua Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shield-app:local'  # Scans the locally built image
          format: 'table'                # Renders vulnerabilities in a clean terminal table
          exit-code: '0'                 # Set to '1' to block pipeline if critical CVEs are found
          ignore-unfixed: true           # Ignores OS vulnerabilities that don't have a vendor patch yet
          vuln-type: 'os,library'        # Scans base OS packages and application dependencies
          severity: 'CRITICAL,HIGH'      # Filters output to show only High and Critical risks

  # ============================================================================
  # RING 3: Infrastructure as Code Policy Audit (Bridgecrew Checkov)
  # Validates Kubernetes & Terraform manifests against security best practices
  # ============================================================================
  ring3-checkov-scan:
    name: "Ring 3: IaC Policy Audit (Checkov)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          framework: kubernetes,terraform  # Targets both K8s YAML files and Terraform code
          output_format: cli              # Outputs results in readable CLI text
          soft_fail: true                 # Keeps pipeline moving while logging security warnings

  # ============================================================================
  # RING 4: Automated Container Build, Push & AWS EKS Deployment
  # Runs ONLY if Rings 1, 2, and 3 succeed, and only on target deployment branches
  # ============================================================================
  ring4-deploy:
    name: "Ring 4: EKS Deployment"
    runs-on: ubuntu-latest
    
    # Pipeline Gatekeeper: Blocks Ring 4 from running if any previous Ring fails
    needs: [ring1-secret-scan, ring2-trivy-scan, ring3-checkov-scan]
    
    # Branch Constraint: Runs deployment on main, old feature branch, AND your new feature branch
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/eks-cicd-pipeline' || github.ref == 'refs/heads/feature/docker-hub-integration'

    steps:
      # Step 4.1: Pull repository source code into the GitHub Actions runner workspace
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Step 4.2: Authenticate to Docker Hub using credentials stored in GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Pulls your saved Docker Hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # Pulls your saved Docker Hub Access Token

      # Step 4.3: Build application container image and push it directly to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .                                   # Root directory containing application files
          file: ./docker-shield                        # Path to your custom Dockerfile
          push: true                                   # Push compiled image to Docker Hub registry
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shield-app:latest  # Tags image as latest release

      # Step 4.4: Authenticate runner to AWS CLI using IAM credentials stored in Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}          # AWS Access Key ID
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # AWS Secret Access Key
          aws-region: eu-west-3                                       # Target AWS region (Paris)

      # Step 4.5: Fetch API endpoint + CA certificates from EKS and generate local kubeconfig
      - name: Update Kubeconfig
        run: |
          # Pairs kubectl on the GitHub runner to your active live EKS cluster in Paris
          aws eks update-kubeconfig --region eu-west-3 --name shield-eks-cluster

      # Step 4.6: Apply Kubernetes manifests to deploy updated container pods to worker nodes
      - name: Deploy to EKS
        run: |
          # Instructs EKS to fetch the new Docker Hub image and update running pods
          kubectl apply -f k8s-deployment.yaml
          
          # Monitors deployment rollout until pods are successfully Running
          kubectl rollout status deployment/project-shield-app --timeout=60s